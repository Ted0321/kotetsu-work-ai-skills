<!doctype html>
<meta charset="utf-8">
<title>収録用ステージ</title>
<style>
  :root{
    --bg:#1a1917; --rail:#211f1d; --line:#332f2b; --panel:#extra;
    --ink:#eeece7; --ink2:#a9a49c; --ink3:#736e66;
    --accent:#c96442; --chip:#2a2724;
    --font: system-ui,-apple-system,"Segoe UI","Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic UI",Meiryo,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--font)}
  .app{display:flex;height:100vh;width:100vw}

  /* ---------- 左1/4: セッション一覧 ---------- */
  .rail{width:25%;flex:none;background:var(--rail);border-right:1px solid var(--line);
        display:flex;flex-direction:column;padding:14px 12px;gap:12px}
  .brand{display:flex;align-items:center;gap:8px;padding:2px 6px 8px}
  .glyph{width:20px;height:20px;flex:none;border-radius:5px;background:var(--accent)}
  .brand b{font-size:13.5px;font-weight:600;letter-spacing:.02em}
  .newbtn{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);
          border-radius:8px;font-size:12.5px;color:var(--ink2);background:transparent}
  .newbtn span:first-child{color:var(--accent);font-weight:700}
  .seclabel{font-size:10px;letter-spacing:.12em;color:var(--ink3);padding:4px 6px 0;text-transform:uppercase}
  .list{display:flex;flex-direction:column;gap:2px}
  .item{padding:8px 10px;border-radius:7px;font-size:12.5px;color:var(--ink2);
        white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .item .when{display:block;font-size:10.5px;color:var(--ink3);margin-top:2px}
  .item.on{background:#2b2724;color:var(--ink)}
  .item.fresh{opacity:0;transform:translateY(-6px);transition:opacity .45s,transform .45s}
  .item.fresh.in{opacity:1;transform:none}

  /* ---------- 右3/4: チャット ---------- */
  .main{flex:1;position:relative;display:flex;flex-direction:column;min-width:0}
  .topbar{height:44px;flex:none;border-bottom:1px solid var(--line);display:flex;align-items:center;
          padding:0 18px;gap:10px;font-size:12.5px;color:var(--ink2)}
  .dot{width:7px;height:7px;border-radius:50%;background:#4a8f5b}
  .stream{flex:1;overflow:hidden;padding:26px 96px;display:flex;flex-direction:column;gap:20px}

  .msg{opacity:0;transform:translateY(8px);transition:opacity .4s,transform .4s}
  .msg.in{opacity:1;transform:none}
  .user{align-self:flex-end;max-width:78%;background:#2b2724;border:1px solid var(--line);
        border-radius:12px;padding:11px 14px;font-size:14px;line-height:1.7}
  .user .att{display:inline-flex;align-items:center;gap:7px;background:#332f2b;border-radius:6px;
             padding:5px 9px;font-size:12px;color:var(--ink2);margin-bottom:8px}
  .xls{width:14px;height:14px;border-radius:3px;background:#1d6f42;flex:none}
  .bot{display:flex;gap:12px;max-width:88%}
  .avatar{width:22px;height:22px;flex:none;border-radius:6px;background:var(--accent);margin-top:2px}
  .bot .body{font-size:14px;line-height:1.8;color:var(--ink)}
  .think{display:flex;align-items:center;gap:9px;color:var(--ink2);font-size:13px;margin-top:10px}
  .spin{width:13px;height:13px;border-radius:50%;border:2px solid #46413b;border-top-color:var(--accent);
        animation:sp .8s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .tool{font-size:12.5px;color:var(--ink3);margin-top:8px;font-variant-numeric:tabular-nums}

  /* ---------- 入力欄 ---------- */
  .composer{flex:none;padding:0 96px 22px}
  .chips{display:flex;gap:8px;margin-bottom:8px;min-height:0}
  .chip{display:inline-flex;align-items:center;gap:8px;background:var(--chip);border:1px solid var(--line);
        border-radius:8px;padding:7px 11px;font-size:12px;color:var(--ink2);
        opacity:0;transform:translateY(5px);transition:opacity .35s,transform .35s}
  .chip.in{opacity:1;transform:none}
  .chip .sz{color:var(--ink3);font-size:11px}
  .box{border:1px solid var(--line);border-radius:12px;background:#211f1d;padding:13px 15px;
       display:flex;align-items:center;gap:10px;min-height:48px}
  .box.focus{border-color:#4a443d}
  .typed{font-size:14px;line-height:1.6;color:var(--ink);white-space:pre-wrap}
  .caret{display:inline-block;width:1.5px;height:16px;background:var(--accent);vertical-align:-3px;
         animation:bl 1s step-end infinite}
  @keyframes bl{50%{opacity:0}}
  .send{margin-left:auto;width:28px;height:28px;flex:none;border-radius:7px;background:#332f2b;
        display:flex;align-items:center;justify-content:center;color:var(--ink3);font-size:14px}
  .send.hot{background:var(--accent);color:#fff}

  /* ---------- 右からせり出すパネル ---------- */
  .panel{position:absolute;inset:0 0 0 0;transform:translateX(101%);
         transition:transform .62s cubic-bezier(.22,.61,.36,1);
         background:#fff;border-left:1px solid var(--line);display:flex;flex-direction:column}
  .panel.open{transform:none}
  .phead{height:38px;flex:none;background:#211f1d;border-bottom:1px solid var(--line);
         display:flex;align-items:center;gap:9px;padding:0 14px;font-size:12px;color:var(--ink2)}
  .phead .fname{color:var(--ink)}
  .phead .right{margin-left:auto;color:var(--ink3);font-size:11px}
  iframe{flex:1;width:100%;border:0;background:#fff}

  /* ---------- 疑似カーソル ---------- */
  #cur{position:fixed;left:0;top:0;width:17px;height:17px;border-radius:50%;
       background:rgba(255,255,255,.82);box-shadow:0 0 0 1.5px rgba(0,0,0,.45),0 2px 7px rgba(0,0,0,.4);
       pointer-events:none;z-index:99;opacity:0;transition:opacity .3s;transform:translate(-50%,-50%)}
  #cur.on{opacity:1}
  #cur.tap{animation:tap .32s ease}
  @keyframes tap{50%{transform:translate(-50%,-50%) scale(.62)}}
</style>

<div class="app">
  <aside class="rail">
    <div class="brand"><i class="glyph"></i><b>Claude Code</b></div>
    <div class="newbtn"><span>+</span><span>新規セッション</span></div>
    <div class="seclabel">最近のセッション</div>
    <div class="list" id="list">
      <div class="item">請求データの突合スクリプト<span class="when">昨日</span></div>
      <div class="item">議事録の論点整理<span class="when">2日前</span></div>
      <div class="item">競合IRの読み込み<span class="when">3日前</span></div>
      <div class="item">週次レポートの自動化<span class="when">先週</span></div>
    </div>
  </aside>

  <main class="main">
    <div class="topbar"><i class="dot"></i><span id="ttl">新規セッション</span></div>

    <div class="stream" id="stream">
      <div class="msg user" id="m1">
        <div class="att"><i class="xls"></i>営業部門別_営業利益_2023-2025.xlsx</div>
        <div>添付データを元に、全営業部門の営業利益を可視化するためのグラフを提案して</div>
      </div>
      <div class="msg bot" id="m2">
        <i class="avatar"></i>
        <div class="body">
          <div>わかりました。営業利益を「どう見せるか」で結論が変わるので、考えられる形式を一通り描いて並べます。</div>
          <div class="think" id="think"><i class="spin"></i><span id="thinktxt">データを読んでいます</span></div>
          <div class="tool" id="tool"></div>
        </div>
      </div>
    </div>

    <div class="composer">
      <div class="chips"><div class="chip" id="chip"><i class="xls"></i>営業部門別_営業利益_2023-2025.xlsx<span class="sz">18 KB</span></div></div>
      <div class="box" id="box">
        <div class="typed" id="typed"></div><i class="caret" id="caret"></i>
        <div class="send" id="send">↑</div>
      </div>
    </div>

    <section class="panel" id="panel">
      <div class="phead"><i class="xls" style="background:#c96442"></i>
        <span class="fname">営業利益_チャート試着室.html</span>
        <span class="right">プレビュー</span></div>
      <iframe id="frame" src="./demo-op-profit.html"></iframe>
    </section>
  </main>
</div>
<div id="cur"></div>

<script>
const $=s=>document.querySelector(s);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const cur=$('#cur');

function moveCur(x,y){cur.style.left=x+'px';cur.style.top=y+'px';}
async function glide(x,y,ms=650){
  cur.classList.add('on');
  const r=cur.getBoundingClientRect();
  const x0=r.left+r.width/2||x, y0=r.top+r.height/2||y;
  const t0=performance.now();
  return new Promise(res=>{
    const step=n=>{
      const t=Math.min(1,(n-t0)/ms), k=t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
      moveCur(x0+(x-x0)*k, y0+(y-y0)*k);
      t<1?requestAnimationFrame(step):res();
    };requestAnimationFrame(step);
  });
}
async function tap(){cur.classList.add('tap');await sleep(320);cur.classList.remove('tap');}

async function run(){
  const MSG='添付データを元に、全営業部門の営業利益を可視化するためのグラフを提案して';
  await sleep(700);

  // 1. 新規セッションが一覧に生まれる
  const fresh=document.createElement('div');
  fresh.className='item on fresh';
  fresh.innerHTML='営業利益の可視化<span class="when">たった今</span>';
  $('#list').prepend(fresh);
  await sleep(60); fresh.classList.add('in');
  await sleep(900);

  // 2. Excelを添付
  $('#chip').classList.add('in');
  $('#box').classList.add('focus');
  await sleep(950);

  // 3. 指示を打ち込む
  const typed=$('#typed');
  for(let i=0;i<MSG.length;i++){
    typed.textContent=MSG.slice(0,i+1);
    await sleep(i%7===0?78:52);
  }
  await sleep(600);

  // 4. 送信
  $('#send').classList.add('hot');
  await sleep(320);
  typed.textContent=''; $('#caret').style.display='none';
  $('#chip').classList.remove('in'); $('#send').classList.remove('hot');
  $('#ttl').textContent='営業利益の可視化';
  $('#m1').classList.add('in');
  await sleep(750);

  // 5. Claudeが考える
  $('#m2').classList.add('in');
  const steps=[['データを読んでいます',900],
               ['4部門 × 3年 の営業利益を確認しました',1000],
               ['成立するチャート形式を洗い出しています',1100],
               ['10形式を描画しています',1200]];
  const tool=$('#tool');
  const logs=['Read  営業部門別_営業利益_2023-2025.xlsx',
              'Analyze  4部門 / 3年 / 加算可能な測度 1本',
              'Write  営業利益_チャート試着室.html'];
  for(let i=0;i<steps.length;i++){
    $('#thinktxt').textContent=steps[i][0];
    if(logs[i-1]) tool.textContent=logs[i-1];
    await sleep(steps[i][1]);
  }
  tool.textContent=logs[2];
  $('#think').style.display='none';
  await sleep(450);

  // 6. パネルが右からせり出す
  $('#panel').classList.add('open');
  await sleep(1150);

  // 7. 10枚をゆっくりスクロール
  const fw=$('#frame').contentWindow, fd=$('#frame').contentDocument;
  const max=()=>fd.documentElement.scrollHeight-fw.innerHeight;
  await smoothScroll(fw,0,max(),16500);
  await sleep(500);
  await smoothScroll(fw,max(),0,1600);
  await sleep(600);

  // 8. 目的ボタンを押して、推奨が変わるのを見せる
  const btns=[...fd.querySelectorAll('#purposes button')];
  for(const idx of [0,1]){
    const b=btns[idx]; if(!b) continue;
    const r=b.getBoundingClientRect(), f=$('#frame').getBoundingClientRect();
    await glide(f.left+r.left+r.width/2, f.top+r.top+r.height/2, 620);
    await tap(); b.click();
    await sleep(1800);                    // 理由文を読ませる
    const spot=fd.querySelector('.card.spot');
    if(spot){                             // 選ばれた1枚まで送って見せる
      const to=Math.max(0, Math.min(max(), fw.scrollY + spot.getBoundingClientRect().top - 88));
      await smoothScroll(fw, fw.scrollY, to, 950);
      await sleep(1900);
      await smoothScroll(fw, fw.scrollY, 0, 800);
      await sleep(300);
    }
  }
  cur.classList.remove('on');
  await sleep(900);
  document.title='DONE';
}

function smoothScroll(win,from,to,ms){
  return new Promise(res=>{
    const t0=performance.now();
    const step=n=>{
      const t=Math.min(1,(n-t0)/ms);
      const k=t<.15?(t/.15)*(t/.15)*.5*.15/.5:(t>.9?1-Math.pow(1-t,2)*1.2:t);
      win.scrollTo(0, from+(to-from)*Math.min(1,Math.max(0,k)));
      t<1?requestAnimationFrame(step):res();
    };requestAnimationFrame(step);
  });
}

addEventListener('load',()=>{
  const f=$('#frame');
  if(f.contentDocument&&f.contentDocument.readyState==='complete') run();
  else f.addEventListener('load',run);
});
</script>
